services:
  - type: web
    name: study-assistant-backend
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false        # Set manually in Render Dashboard → Environment
      - key: FRONTEND_URL
        value: https://study-assistant-468n-murex.vercel.app
