services:
  - type: web
    name: mosaic-backend
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false        # Set this manually in Render dashboard (never commit secrets)
      - key: FRONTEND_URL
        sync: false        # Set to your Vercel URL after deploying the frontend
    healthCheckPath: /health
